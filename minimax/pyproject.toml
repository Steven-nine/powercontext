[project]
name = "mmctx"
version = "0.1.0"
description = "Spec-driven context module for the MiniMax ecosystem track"
requires-python = ">=3.12"
dependencies = [
    "pylibseekdb>=1.4.0.post1; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mmctx = "mmctx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmctx"]
